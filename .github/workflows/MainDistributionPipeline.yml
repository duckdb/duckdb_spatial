#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#

name: Main Extension Distribution Pipeline
on:
  pull_request:
    branches:
      - v1.5-variegata
    paths-ignore:
      - '**/README.md'
      - 'doc/**'
  push:
    branches:
      - v1.5-variegata
    paths-ignore:
      - '**/README.md'
      - 'doc/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true


jobs:
  dbscan-unit-tests:
    name: DBSCAN engine regressions
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure engine tests
        run: cmake -S test/unit -B build/dbscan-unit -DCMAKE_BUILD_TYPE=Release
      - name: Build engine tests
        run: cmake --build build/dbscan-unit --parallel 2
      - name: Run engine tests
        run: ctest --test-dir build/dbscan-unit --output-on-failure

  duckdb-latest-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: spatial
      vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
      exclude_archs: 'linux_amd64_musl'

  duckdb-latest-deploy:
    name: Deploy extension binaries
    needs: [duckdb-latest-build, dbscan-unit-tests]
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@v1.5-variegata
    secrets: inherit
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: spatial
      deploy_latest: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main' }}
      exclude_archs: 'linux_amd64_musl'
